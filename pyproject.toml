[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "usos-calendar-filter"
version = "0.1.1"
description = "Clean and customize a USOS iCalendar feed"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["USOS", "calendar", "iCalendar", "ICS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "icalendar>=6.1,<8",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "requests>=2.32,<3",
    "urllib3>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
usos-calendar-filter = "clean_schedule:main"

[project.urls]
Homepage = "https://github.com/svb-gh/usos-calendar-filter"
Issues = "https://github.com/svb-gh/usos-calendar-filter/issues"

[tool.setuptools]
py-modules = ["clean_schedule"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
